- id: ENG-LAB-2026-1012-003
  version: 2
  status: active
  type: procedural
  scope: project:framework-design-lab
  visibility: private
  commitment: locked
  pinned: false
  statement: >-
    The default attacker is a broad permissionless EVM adversary, narrowed per
    engagement; privileged roles are trusted unless the auditor raises them.
    The auditor keeps the agent tool: typed input is captured verbatim outside
    the model, agent interpretations are confirmed in batches on a trusted
    screen, and the tool is confined per engagement with its memory off. After
    a code change, dependency probes are rerun and freshness tiers assigned
    instead of conservative widening. A walking skeleton is built first.
    DEC-008 left Q-008 open; DEC-009 accepted it as amended the same day.
  rationale: "The operator answered Q-015, Q-018, Q-019 and Q-020 in focused rounds after the adversarial review."
  source: "DEC-008: Q-015, Q-018, Q-019 and Q-020 operator answers on 2026-10-12"
