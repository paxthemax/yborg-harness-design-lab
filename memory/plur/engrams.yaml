- id: ENG-LAB-2026-1012-004
  version: 1
  status: active
  type: architectural
  scope: project:framework-design-lab
  visibility: private
  commitment: locked
  pinned: false
  statement: >-
    The evidence workbench is the accepted architecture for the first harness,
    as amended by DEC-008 and DEC-009 (Q-008). One auditor steers, and agents
    propose and carry out work. A deterministic controller enforces authority,
    runs jobs and keeps canonical records that agents cannot write. Approvals
    bind exact revisions, evidence is hash-pinned with trusted-runner receipts,
    and hypothesis, property and scenario investigations share versioned
    records. The first build is the walking skeleton. Numeric limits and the
    choice of store, runner, model provider, sandbox and agent host are not
    accepted, and acceptance does not start implementation.
