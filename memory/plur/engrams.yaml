- id: ENG-LAB-2026-1012-005
  version: 1
  status: active
  type: procedural
  scope: project:framework-design-lab
  visibility: private
  commitment: locked
  pinned: false
  statement: >-
    Auditee statements keep an origin label and per-finding response history
    only. There is no communications log, no independence rule for
    documentation the auditee writes during the engagement and no known-issue
    rule; those gaps are accepted residual risks. A curated cross-engagement
    mechanism library holds public material plus lessons the auditor
    sanitizes and transfers through explicit records. Writing expectations
    before a flow's implementation walkthrough is an optional pre-step, and
    intent recorded after exposure is tagged. Method changes are adopted on
    the existing held-out comparison, and a narrowing change that looks like
    an improvement is an accepted residual risk. There is no urgent
    disclosure path. A follow-up into a different guarantee that needs no new
    capability, permission, budget, attacker power or scope stays in the
    batch as a linked variant.
  rationale: "The operator answered Q-021 to Q-026 in a plain-language walkthrough that gave options and a recommendation for each."
